name: Build Mania Object Unlocker for Anbernic ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260610T000000Z/ bullseye main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260610T000000Z/ bullseye-updates main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260610T000000Z/ bullseye-security main' \
            > /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          apt-get install -y build-essential cmake git ca-certificates file zip python3

      - name: Clone Mania Object Unlocker source
        run: |
          git clone --recursive --depth 1 https://github.com/MegAmi24/Mania-Decomp-Mods.git Mania-Decomp-Mods

      - name: Apply Linux portability fixes
        working-directory: Mania-Decomp-Mods/ManiaObjectUnlocker/ManiaObjectUnlocker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("UnlockCodes.c")
          s = p.read_text()

          s = s.replace('#include "UnlockCodes.h"\n',
                        '#include "UnlockCodes.h"\n#include <stdio.h>\n')

          s = s.replace('FileIO *file = fOpen(cStr, "r");',
                        'FILE *file = fopen(cStr, "r");')
          s = s.replace('fClose(file);',
                        'fclose(file);')

          s = s.replace('FileIO *file2 = fOpen(cStr, "r");',
                        'FILE *file2 = fopen(cStr, "r");')
          s = s.replace('while (fGets(buffer, MAX_LEN, file2))',
                        'while (fgets(buffer, MAX_LEN, file2))')
          s = s.replace('fClose(file2);',
                        'fclose(file2);')

          s = s.replace('strcat_s(lstName, MAX_LEN, buffer);',
                        'strcat(lstName, buffer);')
          s = s.replace('strcpy_s(activeUnlocks[unlockedCount], MAX_LEN, unlockCodes[i].unlock);',
                        'strcpy(activeUnlocks[unlockedCount], unlockCodes[i].unlock);')

          p.write_text(s)
          PY

          grep -nE 'fOpen|fClose|fGets|strcat_s|strcpy_s' UnlockCodes.c || true

      - name: Configure ARM64 Steam/Plus build
        working-directory: Mania-Decomp-Mods/ManiaObjectUnlocker
        run: |
          cmake -B build \
            -DRETRO_REVISION=2 \
            -DRETRO_MOD_LOADER_VER=2 \
            -DGAME_VERSION=6 \
            -DMANIA_PREPLUS=OFF \
            -DMOD_INCLUDE_EDITOR=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG"

      - name: Build
        working-directory: Mania-Decomp-Mods/ManiaObjectUnlocker
        run: |
          cmake --build build --config Release --parallel

      - name: Verify ARM64 library
        working-directory: Mania-Decomp-Mods/ManiaObjectUnlocker
        run: |
          file build/libManiaObjectUnlocker.so
          readelf -h build/libManiaObjectUnlocker.so | grep -E 'Class:|Machine:'
          test -f build/libManiaObjectUnlocker.so
          test -f build/mod.ini

      - name: Package mod
        working-directory: Mania-Decomp-Mods/ManiaObjectUnlocker
        run: |
          rm -rf release
          mkdir -p release/ManiaObjectUnlocker
          cp build/mod.ini release/ManiaObjectUnlocker/mod.ini
          cp build/libManiaObjectUnlocker.so release/ManiaObjectUnlocker/libManiaObjectUnlocker.so

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("UnlockCodes.c").read_text()
          codes = re.findall(r'\\.code\\s*=\\s*"([^"]+)"', src)
          codes = [c for c in codes if c.startswith("writenop ")]
          Path("release/ManiaObjectUnlocker/Codes.txt").write_text("\\n".join(codes) + "\\n")

          mod = Path("release/ManiaObjectUnlocker/mod.ini")
          text = mod.read_text()
          if "Codes=" not in text:
              text = text.rstrip("\\n") + "\\nCodes=Codes.txt\\n"
          mod.write_text(text)
          print(f"Packaged {len(codes)} unlock codes")
          PY

          printf '%s\n' \
            'Built for ARM64 Anbernic/Linux' \
            'RETRO_REVISION=2 (Steam/Mania decomp)' \
            'GAME_VERSION=6' \
            'Linux portability patch applied to UnlockCodes.c' \
            'All supported Mania Object Unlocker codes included in Codes.txt' \
            'Source: https://github.com/MegAmi24/Mania-Decomp-Mods' \
            > release/ManiaObjectUnlocker/BUILD_INFO.txt
          cd release
          zip -r ../ManiaObjectUnlocker-Anbernic-ARM64.zip ManiaObjectUnlocker

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ManiaObjectUnlocker-Anbernic-ARM64
          path: |
            Mania-Decomp-Mods/ManiaObjectUnlocker/ManiaObjectUnlocker-Anbernic-ARM64.zip
            Mania-Decomp-Mods/ManiaObjectUnlocker/build/libManiaObjectUnlocker.so
